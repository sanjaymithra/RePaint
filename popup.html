<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Repaint</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body class="crt-screen">
  <div class="crt-overlay"></div>
  <div class="scanlines"></div>

  <div class="app-container">
    <!-- Header with Master Kill-Switch -->
    <header class="cyber-header">
      <div class="brand-group">
        <div class="synth-logo">
          <span class="logo-grid"></span>
          <span class="logo-sun"></span>
        </div>
        <div class="brand-text">
          <h1 class="brand-title">REPAINT</h1>
          <span class="brand-tag">CSS PROFILES</span>
        </div>
      </div>

      <div class="master-toggle-wrap" title="Master Kill-Switch (All Profiles)">
        <label class="synth-toggle" for="masterKillSwitch">
          <input type="checkbox" id="masterKillSwitch" checked />
          <span class="toggle-track">
            <span class="toggle-thumb">
              <span class="thumb-core"></span>
            </span>
          </span>
        </label>
      </div>
    </header>

    <!-- Main View: Flat Profiles List -->
    <main class="list-view" id="listView">
      <div class="profiles-list" id="profilesList">
        <!-- Dynamically generated rows -->
      </div>

      <div class="empty-state" id="emptyState" hidden>
        <span class="empty-icon">⚡</span>
        <p class="empty-text">No profiles yet.<br/>Click <strong>+</strong> below to add one for this site.</p>
      </div>

      <footer class="list-footer">
        <button class="add-btn" id="btnOpenAddModal" type="button" title="Add profile for current site">
          <span class="add-plus">+</span>
          <span class="add-label">Add Profile</span>
        </button>
      </footer>
    </main>

    <!-- Inline Add Profile Modal / Form View -->
    <section class="modal-view" id="addModalView" hidden>
      <div class="modal-header">
        <span class="modal-badge">NEW PROFILE</span>
        <button class="modal-close-btn" id="btnCancelModal" type="button" title="Cancel">✕</button>
      </div>

      <div class="modal-body">
        <div class="form-group">
          <label for="inputProfileName">Name</label>
          <input type="text" id="inputProfileName" placeholder="e.g. YouTube" autocomplete="off" />
        </div>

        <div class="form-group">
          <label>Upload CSS File</label>
          <div class="file-upload-box" id="fileUploadBox">
            <input type="file" id="cssFileInput" accept=".css,text/css" />
            <div class="upload-inner">
              <span class="upload-icon">📄</span>
              <span class="upload-label" id="fileChosenLabel">Choose a .css file...</span>
            </div>
          </div>
        </div>

        <div class="modal-actions">
          <button class="action-btn secondary" id="btnCancelAdd" type="button">Cancel</button>
          <button class="action-btn primary" id="btnSaveAdd" type="button">Save Profile</button>
        </div>
      </div>
    </section>

    <!-- Creator Signature / Watermark -->
    <footer class="app-credit-footer">
      <span class="credit-text">Built by <span class="credit-author">Sanjay</span></span>
      <span class="credit-sep">·</span>
      <a class="credit-link" href="https://github.com/sanjaymithra" target="_blank" rel="noopener noreferrer" title="Sanjay on GitHub">GitHub</a>
      <span class="credit-sep">·</span>
      <a class="credit-link" href="https://www.linkedin.com/in/sanjay-mithra/" target="_blank" rel="noopener noreferrer" title="Sanjay on LinkedIn">LinkedIn</a>
    </footer>
  </div>

  <script src="themes.js"></script>
  <script src="popup.js"></script>
</body>
</html>
